<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101b2d">
<title>בקרת בקשות ייצור</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">

  <header class="appbar">
    <div class="row1">
      <h1><b>◤</b> בקרת ייצור — מדור</h1>
      <span class="clock"><span class="live"></span><span id="clock-date"></span></span>
    </div>
    <div class="chips" id="chips"></div>
    <div class="searchrow">
      <input type="search" id="f-search" placeholder="חיפוש: פרויקט, מבקש, נושא, #מזהה...">
      <button class="iconbtn" id="btn-subfilters" title="סינון לפי פרויקט ומיקום">⚙</button>
    </div>
    <div class="subfilters" id="subfilters">
      <select id="f-project"><option value="">כל הפרויקטים</option></select>
      <select id="f-location"><option value="">כל מיקומי הייצור</option></select>
    </div>
  </header>

  <main class="feed" id="feed"></main>
  <div class="empty" id="empty" hidden>אין בקשות להצגה</div>

</div>

<nav class="navbar">
  <div class="inner">
    <button class="nav-item on" id="btn-queue"><span class="ic">◉</span>תור עבודות</button>
    <button class="nav-item primary" id="btn-new"><span class="ic">＋</span>בקשה חדשה</button>
  </div>
</nav>

<!-- גיליון פרטי בקשה -->
<div class="sheet-back" id="modal-detail" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="d-title"></h2>
      <button class="btn-close" data-close>&times;</button>
    </div>
    <div id="d-banner"></div>
    <div class="sheet-body" id="d-body"></div>
    <div class="sheet-foot" id="d-foot"></div>
  </div>
</div>

<!-- גיליון טופס (חדשה / עריכה / ייבוא) -->
<div class="sheet-back" id="modal-form" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="form-title">בקשה חדשה</h2>
      <button class="btn-close" data-close>&times;</button>
    </div>
    <div class="sheet-body">
      <form id="req-form">
        <div class="fgrid">
          <label>פרויקט *<input name="project"></label>
          <label>רשום תחת (כינוי)<input name="project_alias"></label>
          <label class="wide">נושא הייצור *<textarea name="subject" rows="2"></textarea></label>
          <label>כמות *<input name="quantity"></label>
          <label>מכניס עבודה *<input name="requester"></label>
          <label>בקר מאשר *<input name="approver"></label>
          <label>תאריך אישור *<input name="approval_date" type="date"></label>
          <label>מיקום ייצור *<input name="location" list="loc-list"><datalist id="loc-list"></datalist></label>
          <label>תג"ב נדרש *<input name="due_date" type="date"></label>
          <label class="wide">שם ייצור במערכת *<input name="system_name"></label>
          <label>מזהה חיצוני (#)<input name="external_id"></label>
          <label>עדיפות<select name="priority"><option>רגיל</option><option>דחוף</option><option>מיידי</option></select></label>
          <label class="wide">הערות מיוחדות<textarea name="notes" rows="2"></textarea></label>
          <label class="wide">שם המעדכן (מי מזין כרגע)<input name="actor" id="actor-input"></label>
        </div>
        <div class="missing-note" id="form-missing"></div>
      </form>
    </div>
    <div class="sheet-foot">
      <button class="btn primary wide" id="btn-save">שמירה</button>
      <button class="btn wide" data-close>ביטול</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
