<style>
/* ===== בקרת בקשות ייצור — mobile-first, ערכת "חמ"ל" כהה ===== */
:root {
  --ground: #0a111e; --panel: #101b2d; --panel-2: #0d1626; --panel-3: #16233a;
  --line: #22314b; --line-soft: #182439;
  --text: #dbe6f5; --muted: #7e90ab; --faint: #55647e;
  --amber: #ffb020; --amber-dim: #4a3510;
  --red: #ff5d5d; --red-dim: #3d1a1f;
  --green: #3dd68c; --green-dim: #143528;
  --blue: #5aa7ff; --blue-dim: #16283f;
  --purple: #b18cff; --purple-dim: #291f45;
  --mono: "Consolas", "Courier New", monospace;
  --sans: "Segoe UI", "Arial Hebrew", Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html { background: var(--ground); }
body {
  background: var(--ground); color: var(--text);
  font-family: var(--sans); font-size: 15px; direction: rtl;
  padding-bottom: 76px; /* מקום לניווט התחתון */
}
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font-family: inherit; }
input, select, textarea {
  font-family: inherit; font-size: 15px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel-2); color: var(--text); width: 100%;
}
input::placeholder, textarea::placeholder { color: var(--faint); }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }

.shell { max-width: 640px; margin: 0 auto; }

/* ===== פס עליון ===== */
.appbar {
  position: sticky; top: 0; z-index: 5;
  background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 12px 14px 10px;
}
.appbar .row1 { display: flex; align-items: baseline; gap: 10px; }
.appbar h1 { font-size: 16.5px; font-weight: 700; flex: 1; }
.appbar h1 b { color: var(--amber); }
.appbar .clock { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
.live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-inline-end: 5px; animation: blink 2.4s infinite; }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .live { animation: none; } .sheet-back .sheet { animation: none; } }

/* צ'יפים — מסננים ומדדים באותה שורה */
.chips { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; border: 1px solid var(--line); border-radius: 999px;
  background: var(--panel-2); color: var(--muted); padding: 5px 12px;
  font-size: 12.5px; cursor: pointer; white-space: nowrap;
}
.chip b { font-family: var(--mono); font-weight: 700; margin-inline-start: 4px; }
.chip.on { background: var(--amber); border-color: var(--amber); color: #1a1204; font-weight: 700; }
.chip.alert b { color: var(--red); } .chip.warn b { color: var(--amber); } .chip.ok b { color: var(--green); }
.chip.on.alert b, .chip.on.warn b, .chip.on.ok b { color: #1a1204; }

/* חיפוש וסינון משני */
.searchrow { display: flex; gap: 6px; margin-top: 8px; }
.searchrow input[type=search] { flex: 1; padding: 8px 12px; font-size: 14px; }
.searchrow .iconbtn {
  border: 1px solid var(--line); background: var(--panel-2); color: var(--muted);
  border-radius: 10px; width: 40px; flex-shrink: 0; cursor: pointer; font-size: 15px;
}
.searchrow .iconbtn.on { color: var(--amber); border-color: var(--amber); }
.subfilters { display: none; gap: 6px; margin-top: 8px; }
.subfilters.open { display: flex; }
.subfilters select { font-size: 13.5px; padding: 8px 10px; }

/* ===== הפיד ===== */
.feed { padding: 12px 14px 20px; display: flex; flex-direction: column; gap: 10px; }
.day-label { font-size: 11px; color: var(--faint); text-align: center; margin: 6px 0 -2px; letter-spacing: .05em; }
.empty { padding: 44px 20px; text-align: center; color: var(--faint); }

.req {
  background: var(--panel); border: 1px solid var(--line-soft); border-radius: 14px;
  padding: 12px 14px; border-inline-start: 5px solid var(--line);
  cursor: pointer; text-align: inherit; width: 100%; display: block; color: inherit; font-size: inherit;
}
.req:hover { background: var(--panel-3); }
.req.hot { border-inline-start-color: var(--red); }
.req.warm { border-inline-start-color: var(--amber); }
.req.closed { opacity: .55; }
.req .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.req .proj { font-weight: 700; font-size: 14.5px; }
.req .proj .alias { font-weight: 400; color: var(--faint); font-size: 12px; }
.req .id { font-family: var(--mono); font-size: 11px; color: var(--faint); flex-shrink: 0; }
.req .what { font-size: 13px; color: var(--muted); margin: 4px 0 9px; line-height: 1.5; }
.req .foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11.5px; }
.req .miss { margin-top: 8px; font-size: 12px; color: var(--red); border-top: 1px dashed var(--line-soft); padding-top: 7px; }

.count { font-family: var(--mono); font-weight: 700; font-size: 12px; }
.count.red { color: var(--red); } .count.amber { color: var(--amber); } .count.ok { color: var(--green); } .count.dim { color: var(--faint); }
.pill {
  background: var(--panel-2); border: 1px solid var(--line-soft);
  border-radius: 999px; padding: 3px 9px; color: var(--muted);
}
.lamp { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-inline-end: 5px; vertical-align: 0; }
.lamp.red { background: var(--red); box-shadow: 0 0 6px var(--red); }
.lamp.amber { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
.lamp.blue { background: var(--blue); } .lamp.purple { background: var(--purple); }
.lamp.green { background: var(--green); } .lamp.grey { background: var(--faint); }

/* ===== ניווט תחתון + FAB ===== */
.navbar {
  position: fixed; bottom: 0; inset-inline: 0; z-index: 6;
  background: var(--panel); border-top: 1px solid var(--line);
}
.navbar .inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); padding: 7px 0 12px; }
.nav-item { background: none; border: none; text-align: center; font-size: 10.5px; color: var(--faint); cursor: pointer; }
.nav-item .ic { font-size: 20px; display: block; margin-bottom: 2px; }
.nav-item.primary .ic {
  background: var(--amber); color: #1a1204; width: 44px; height: 44px; line-height: 44px;
  border-radius: 50%; margin: -18px auto 2px; font-size: 24px; font-weight: 700;
  box-shadow: 0 4px 14px rgba(255, 176, 32, .35);
}
.nav-item.on { color: var(--amber); }

/* ===== גיליונות (מסכים נשלפים) ===== */
.sheet-back {
  position: fixed; inset: 0; z-index: 10; background: rgba(4, 9, 18, .7);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  background: var(--ground); border: 1px solid var(--line); border-bottom: none;
  border-radius: 18px 18px 0 0; width: 100%; max-width: 640px;
  max-height: 94dvh; display: flex; flex-direction: column;
  animation: rise .18s ease-out;
}
@keyframes rise { from { transform: translateY(30px); opacity: .6; } }
.sheet-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  border-radius: 18px 18px 0 0;
}
.sheet-head h2 { font-size: 16px; flex: 1; }
.sheet-head .sub2 { font-size: 12px; color: var(--faint); font-weight: 400; display: block; margin-top: 2px; }
.btn-close { background: none; border: none; font-size: 24px; color: var(--faint); cursor: pointer; padding: 0 4px; }
.sheet-body { padding: 14px 16px; overflow-y: auto; flex: 1; }
.sheet-foot {
  display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px 16px;
  border-top: 1px solid var(--line); background: var(--panel);
}

.banner { font-size: 12.5px; font-weight: 700; padding: 9px 16px; }
.banner.red { background: var(--red-dim); color: var(--red); }
.banner.amber { background: var(--amber-dim); color: var(--amber); }

/* כפתורים */
.btn {

.btn.wide { flex: 1 1 100%; }
.btn.half { flex: 1 1 45%; }

/* פירוט בקשה */
.kv { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 14px; padding: 4px 14px; }
.kv .row { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
.kv .row:last-child { border-bottom: none; }
.kv .k { color: var(--faint); font-size: 12px; flex-shrink: 0; padding-top: 1px; }

.hist { margin-top: 14px; font-size: 12.5px; color: var(--muted); }
.hist h3 { font-size: 12px; color: var(--faint); letter-spacing: .05em; margin-bottom: 8px; }
.hist .h-item { padding: 6px 10px 6px 2px; border-inline-start: 2px solid var(--line); margin-inline-start: 6px; margin-bottom: 2px; }
.hist .h-item b { color: var(--text); font-weight: 600; }
.hist .h-item .ts { font-family: var(--mono); font-size: 11px; color: var(--faint); }

/* טפסים */
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fgrid label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }

textarea { resize: vertical; }
.missing-note { color: var(--red); font-size: 12.5px; margin-top: 12px; min-height: 18px; }
#import-zone textarea { width: 100%; margin: 6px 0 8px; font-size: 13px; }
.parse-note { margin-top: 8px; font-size: 13px; min-height: 18px; }
.parse-note.ok { color: var(--green); }
.parse-note.warn { color: var(--amber); }
hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }

/* טוסט */
.toast {
  position: fixed; bottom: 86px; inset-inline-start: 50%; transform: translateX(50%);
  background: var(--panel-3); border: 1px solid var(--amber); color: var(--text);
  padding: 10px 20px; border-radius: 999px; z-index: 30; font-size: 13.5px;

}
[hidden] { display: none !important; }

/* מסכים רחבים: הגיליונות הופכים לדיאלוג צף */
@media (min-width: 700px) {
  .sheet-back { align-items: flex-start; padding: 5vh 16px; }
  .sheet { border-radius: 16px; border-bottom: 1px solid var(--line); max-height: 88vh; }
  .sheet-head { border-radius: 16px 16px 0 0; }
}
@media (max-width: 480px) { .fgrid { grid-template-columns: 1fr; } }

/* ===== מסך התחברות ===== */
.login-wrap { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 20px; }

}

.login-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--panel-2); border-radius: 10px; padding: 4px; }

}
.login-tabs button.on { background: var(--amber); color: #1a1204; font-weight: 700; }
.login-card label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--muted); }
.login-error { color: var(--red); font-size: 13px; text-align: center; }

/* סרגל משתמש בפס העליון */
.userchip { font-size: 11.5px; color: var(--faint); background: none; border: none; cursor: pointer; padding: 0; }
.userchip:hover { color: var(--muted); }

/* ===== תוספות דמו ===== */
.demobar { background: var(--amber-dim); color: var(--amber); font-size: 12px; padding: 7px 14px; text-align: center; }
.demobar b { font-weight: 700; }

<script>
"use strict";
/* ===== דמו: כל הלוגיקה של המערכת, נתונים בזיכרון ===== */

const $ = (s) => document.querySelector(s);
const REQUIRED = { project: "פרויקט", subject: "נושא הייצור", quantity: "כמות",
  requester: "מכניס עבודה", approver: "בקר מאשר", approval_date: "תאריך אישור",
  location: "מיקום ייצור", due_date: 'תג"ב נדרש', system_name: "שם ייצור במערכת" };
const STATUSES = ["מעוכבת", "ממתינה לאישור", "מאושרת", "בייצור", "הושלמה", "נדחתה", "בוטלה"];
const OPEN_STATUSES = ["מעוכבת", "ממתינה לאישור", "מאושרת", "בייצור"];
const LAMP = { "מעוכבת": "red", "ממתינה לאישור": "amber", "מאושרת": "blue",
  "בייצור": "purple", "הושלמה": "green", "נדחתה": "grey", "בוטלה": "grey" };
const NEXT_ACTIONS = { "מעוכבת": ["ממתינה לאישור", "בוטלה"], "ממתינה לאישור": ["מאושרת", "נדחתה"],
  "מאושרת": ["בייצור", "בוטלה"], "בייצור": ["הושלמה", "בוטלה"], "הושלמה": [],
  "נדחתה": ["ממתינה לאישור"], "בוטלה": ["ממתינה לאישור"] };
const FORM_FIELDS = ["project", "project_alias", "subject", "quantity", "requester",
  "approver", "approval_date", "location", "due_date", "system_name", "external_id", "notes", "priority"];
const FIELD_LABELS = { ...REQUIRED, project_alias: "רשום תחת", external_id: "מזהה חיצוני",
  notes: "הערות מיוחדות", priority: "עדיפות", status: "סטטוס" };

/* --- מחסן בזיכרון: 4 הבקשות האמיתיות מהצ'אט --- */
let user = "";
let seq = 0;
const D = (offsetDays) => new Date(Date.now() + offsetDays * 864e5).toISOString().slice(0, 10);
// תאריכים יחסיים להיום, כדי שהדמו תמיד יראה חי: חריגה, תג"ב מחר, ותג"ב עתידי
const requests = [];
const history = [];

function base(fields) {
  return { id: ++seq, serial: 1000 + seq, project: "", project_alias: "", subject: "",
    quantity: "", requester: "", approver: "", approval_date: "", location: "",
    due_date: "", system_name: "", external_id: "", notes: "", priority: "רגיל",
    status: "מעוכבת", created_at: nowIso(), updated_at: nowIso(), completed_at: "", ...fields };
}
function nowIso() { return new Date().toISOString().slice(0, 19); }
function log(requestId, action, field = "", oldVal = "", newVal = "", actor = user) {
  history.unshift({ id: history.length + 1, request_id: requestId, ts: nowIso(), actor, action, field, old_value: oldVal, new_value: newVal });
}
function missingFields(f) {
  return Object.entries(REQUIRED).filter(([k]) => !String(f[k] || "").trim()).map(([, v]) => v);
}
function intakeStatus(f) {
  const missing = missingFields(f);
  const approvalOnly = new Set(["בקר מאשר", "תאריך אישור"]);
  if (missing.some((m) => !approvalOnly.has(m))) return "מעוכבת";
  return missing.length ? "ממתינה לאישור" : "מאושרת";
}
function enrich(r) {
  const out = { ...r, missing: missingFields(r), overdue: false, due_soon: false, days_to_due: null };
  if (/^\d{4}-\d{2}-\d{2}$/.test(r.due_date || "") && OPEN_STATUSES.includes(r.status)) {
    const days = Math.round((Date.parse(r.due_date) - Date.parse(D(0))) / 864e5);
    out.days_to_due = days;
    out.overdue = days < 0;
    out.due_soon = days >= 0 && days <= 2;
  }
  return out;
}
function waDate(iso) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || "")) return iso || "—";
  const [y, m, d] = iso.split("-");
  return `${+d}.${+m}.${y.slice(2)}`;
}
function toWhatsApp(f) {
  const v = (k, dflt = "—") => f[k] || dflt;
  let project = v("project");
  if (f.project_alias) project += ` (רשום תחת ${f.project_alias})`;
  let sys = v("system_name");
  if (f.external_id) sys += `\n* #${f.external_id}`;
  return ["*בקשת ייצור*", "", "פרויקט:", `* ${project}`, "נושא הייצור:", `* ${v("subject")}`, "",
    "כמות:", `* ${v("quantity")}`, "מכניס עבודה:", `* ${v("requester")}`, "",
    "בקר מאשר:", `* ${v("approver")}`, `* תאריך אישור: ${waDate(f.approval_date)}`, "",
    "מיקום ייצור:", `* ${v("location")}`, "", 'תג"ב נדרש:', `* ${waDate(f.due_date)}`, "",
    "שם ייצור במערכת:", `* ${sys}`, "", "הערות מיוחדות:", `* ${v("notes", "אין")}`].join("\n");
}

function seed() {
  const samples = [
    { project: "MD", subject: "ייצור גיגים להתקן הטלה MD", quantity: "4", requester: "אלון",
      approver: "דימה", approval_date: D(-28), location: "בית מלאכה תלת־ממד", due_date: D(-22),
      system_name: "ייצור פלציב וגיגים להתקן", notes: "אין", status: "הושלמה", completed_at: D(-22) },
    { project: "פולו - MD", subject: "קדיחת פלטת תיאום מאלומיניום וריתוכה עם חלקי אלומיניום שאספק.",
      quantity: "1", requester: "אלון בן דוד", approver: "דימה גופמן", approval_date: D(-26),
      location: "מסגריה, עבודת מסגרות ודיגום מכאני", due_date: D(-23),
      system_name: "קדיחת פלטת תיאום וריתוך אלומיניום להתקן הטלה ראשונית לבדיקת SBRU.",
      notes: "אספק שבלונה לקדחים ואת חלקי האלומיניום שאמיתי יעשה.", status: "הושלמה", completed_at: D(-23) },
    { project: "MBaz", project_alias: "שועל מעופף",
      subject: "חיתוך וכיפוף פלטות אלומיניום לייצור מסיט תרמילים לMBaz", quantity: "2",
      requester: "גיא דהאן", approver: "רונן פירמן", approval_date: D(-8),
      location: "מסגריה / דגמים", due_date: D(-6), system_name: "מסיט תרמילים MBaz",
      external_id: "1114", notes: "אין", status: "בייצור" },
    // ההודעה של צרצר הגיעה חתוכה — בלי "שם ייצור במערכת" ⇒ מעוכבת
    { project: "צרצר", subject: "ג'יג חתיכה לריטיינר 2", quantity: "חלק בודד",
      requester: "עידו מרון", approver: "רונן פירמן", approval_date: D(-2),
      location: "במדפסת fortus", due_date: D(1), status: "מעוכבת" },
  ];
  for (const s of samples) {
    const row = base(s);
    requests.push(row);
    log(row.id, "נוצרה", "", "", row.status, "seed");
    const miss = missingFields(row);
    if (miss.length) log(row.id, "חוסרים בקליטה", "", "", miss.join(", "), "seed");
  }
}

function createRequest(data) {
  const fields = {};
  for (const k of FORM_FIELDS) fields[k] = String(data[k] || "").trim();
  fields.status = intakeStatus(fields);
  const row = base(fields);
  requests.push(row);
  log(row.id, "נוצרה", "", "", row.status);
  const miss = missingFields(row);
  if (miss.length) log(row.id, "חוסרים בקליטה", "", "", miss.join(", "));
  return enrich(row);
}

function updateRequest(id, data) {
  const row = requests.find((r) => r.id === id);
  if (!row) return null;
  const changes = [];
  for (const k of [...FORM_FIELDS, "status"]) {
    if (!(k in data)) continue;
    const val = String(data[k] || "").trim();
    if (k === "status" && val && !STATUSES.includes(val)) continue;
    if (val !== (row[k] || "")) { changes.push([k, row[k] || "", val]); row[k] = val; }
  }
  if (!("status" in data) && ["מעוכבת", "ממתינה לאישור"].includes(row.status)) {
    const auto = intakeStatus(row);
    if (auto !== row.status) { changes.push(["status", row.status, auto]); row.status = auto; }
  }
  if (changes.length) row.updated_at = nowIso();
  for (const [k, oldV, newV] of changes) {
    if (k === "status") {
      log(id, "שינוי סטטוס", k, oldV, newV);
      if (newV === "הושלמה") row.completed_at = nowIso();
    } else {
      log(id, "עדכון", FIELD_LABELS[k] || k, oldV, newV);
      if (["quantity", "due_date", "subject"].includes(k) && row.approval_date &&
          !["מעוכבת", "ממתינה לאישור"].includes(row.status)) {
        log(id, "שינוי אחרי אישור", FIELD_LABELS[k] || k, oldV, newV);
      }
    }
  }
  return enrich(row);
}

function stats() {
  const e = requests.map(enrich);
  return {
    open: e.filter((r) => OPEN_STATUSES.includes(r.status)).length,
    overdue: e.filter((r) => r.overdue).length,
    delayed: e.filter((r) => r.status === "מעוכבת").length,
    awaiting: e.filter((r) => r.status === "ממתינה לאישור").length,
    due_soon: e.filter((r) => r.due_soon).length,
    completed_30d: e.filter((r) => r.status === "הושלמה").length,
    projects: [...new Set(requests.map((r) => r.project).filter(Boolean))].sort(),
    locations: [...new Set(requests.map((r) => r.location).filter(Boolean))].sort(),
  };
}

/* ===== UI — זהה לאפליקציה ===== */
let chip = "open", editId = null, currentId = null;

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmtDate(iso) { return waDate((iso || "").slice(0, 10)); }
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(el._t); el._t = setTimeout(() => (el.hidden = true), 2600);
}

const CHIPS = [
  { key: "open", label: "פתוחות", stat: "open", cls: "" },
  { key: "overdue", label: 'חורגות תג"ב', stat: "overdue", cls: "alert" },
  { key: "מעוכבת", label: "מעוכבות", stat: "delayed", cls: "alert" },
  { key: "ממתינה לאישור", label: "ממתינות", stat: "awaiting", cls: "warn" },
  { key: "due_soon", label: 'תג"ב קרוב', stat: "due_soon", cls: "warn" },
  { key: "הושלמה", label: "הושלמו", stat: "completed_30d", cls: "ok" },
  { key: "all", label: "הכל", stat: null, cls: "" },
];

function render() {
  const st = stats();
  $("#chips").innerHTML = CHIPS.map((c) =>
    `<button class="chip ${c.cls} ${chip === c.key ? "on" : ""}" data-chip="${c.key}">${c.label}${c.stat ? `<b>${st[c.stat]}</b>` : ""}</button>`).join("");
  document.querySelectorAll(".chip").forEach((el) =>
    el.addEventListener("click", () => { chip = el.dataset.chip; render(); }));

  for (const [sel, values] of [["#f-project", st.projects], ["#f-location", st.locations]]) {
    const box = $(sel), cur = box.value, first = box.querySelector("option");
    box.innerHTML = ""; box.appendChild(first);
    values.forEach((v) => { const o = document.createElement("option"); o.value = o.textContent = v; box.appendChild(o); });
    box.value = cur;
  }
  $("#loc-list").innerHTML = st.locations.map((l) => `<option value="${esc(l)}">`).join("");

  const q = $("#f-search").value.trim();
  const proj = $("#f-project").value, loc = $("#f-location").value;
  let rows = requests.map(enrich).filter((r) => {
    if (proj && r.project !== proj) return false;
    if (loc && r.location !== loc) return false;
    if (q) {
      const hay = [r.project, r.project_alias, r.subject, r.requester, r.approver, r.system_name, r.external_id, r.notes, String(r.serial)].join(" ");
      if (!hay.includes(q)) return false;
    }
    switch (chip) {
      case "open": return OPEN_STATUSES.includes(r.status);
      case "overdue": return r.overdue;
      case "due_soon": return r.due_soon;
      case "all": return true;
      default: return r.status === chip;
    }
  });
  const urgency = (r) => !OPEN_STATUSES.includes(r.status) ? 1e9 : r.days_to_due == null ? 1e8 : r.days_to_due;
  rows.sort((a, b) => urgency(a) - urgency(b));
  const openRows = rows.filter((r) => OPEN_STATUSES.includes(r.status));
  const closedRows = rows.filter((r) => !OPEN_STATUSES.includes(r.status));

  const card = (r) => {
    const open = OPEN_STATUSES.includes(r.status);
    const rail = r.overdue ? "hot" : r.due_soon ? "warm" : "";
    const badge = r.overdue ? `<span class="count red">⏰ חריגה ${-r.days_to_due} ימים</span>`
      : r.due_soon ? `<span class="count amber">תג"ב ${r.days_to_due === 0 ? "היום" : r.days_to_due === 1 ? "מחר" : "בעוד יומיים"} · ${fmtDate(r.due_date)}</span>`
      : open && r.days_to_due != null ? `<span class="count ok">עוד ${r.days_to_due} ימים · ${fmtDate(r.due_date)}</span>`
      : open ? `<span class="count dim">ללא תג"ב</span>`
      : `<span class="count ${r.status === "הושלמה" ? "ok" : "dim"}">${r.status === "הושלמה" ? "✔ " : ""}${esc(r.status)} ${fmtDate(r.completed_at || r.updated_at)}</span>`;
    return `<button class="req ${rail} ${open ? "" : "closed"}" data-id="${r.id}">
      <div class="top"><span class="proj">${esc(r.project) || "ללא פרויקט"}${r.project_alias ? ` <span class="alias">(${esc(r.project_alias)})</span>` : ""}</span>
        <span class="id">#${r.serial}${r.external_id ? ` · #${esc(r.external_id)}` : ""}</span></div>
      <div class="what">${esc(r.subject) || "—"}${r.quantity ? ` · ${esc(r.quantity)}` : ""}${r.location ? ` · ${esc(r.location)}` : ""}</div>
      <div class="foot">${badge}
        <span class="pill"><span class="lamp ${LAMP[r.status] || "grey"}"></span>${esc(r.status)}</span>
        ${r.requester ? `<span class="pill">${esc(r.requester)}</span>` : ""}
        ${r.priority !== "רגיל" ? `<span class="pill" style="color:var(--red);border-color:var(--red)">${esc(r.priority)}</span>` : ""}</div>
      ${r.missing.length ? `<div class="miss">⚠ חסר: ${esc(r.missing.join(", "))}</div>` : ""}
    </button>`;
  };
  $("#feed").innerHTML =
    (openRows.length ? `<div class="day-label">לפי דחיפות תג"ב</div>` + openRows.map(card).join("") : "") +
    (closedRows.length ? `<div class="day-label">סגורות</div>` + closedRows.map(card).join("") : "") +
    (rows.length ? "" : `<div class="empty">אין בקשות להצגה</div>`);
  document.querySelectorAll(".req").forEach((el) =>
    el.addEventListener("click", () => openDetail(+el.dataset.id)));
}

function openDetail(id) {
  const r = enrich(requests.find((x) => x.id === id));
  currentId = id;
  $("#d-title").innerHTML = `#${r.serial} · ${esc(r.project) || "ללא פרויקט"}<span class="sub2">${esc(r.subject)}</span>`;
  $("#d-banner").innerHTML = r.overdue
    ? `<div class="banner red">⏰ חריגת תג"ב — ${-r.days_to_due} ימים. תג"ב נדרש: ${fmtDate(r.due_date)}</div>`
    : r.missing.length ? `<div class="banner amber">⚠ חסרים: ${esc(r.missing.join(", "))} — מעוכבת עד השלמה (נוהל 16/06)</div>` : "";
  const kv = [
    ["סטטוס", `<span class="lamp ${LAMP[r.status] || "grey"}"></span>${esc(r.status)}`],
    ["רשום תחת", r.project_alias && esc(r.project_alias)],
    ["כמות", esc(r.quantity)],
    ["מכניס עבודה", esc(r.requester)],
    ["בקר מאשר", r.approver && `${esc(r.approver)}${r.approval_date ? ` · ${fmtDate(r.approval_date)}` : " · טרם אושר"}`],
    ["מיקום ייצור", esc(r.location)],
    ['תג"ב נדרש', fmtDate(r.due_date)],
    ["שם ייצור במערכת", esc(r.system_name)],
    ["מזהה חיצוני", r.external_id && `#${esc(r.external_id)}`],
    ["עדיפות", r.priority !== "רגיל" && esc(r.priority)],
    ["הערות מיוחדות", esc(r.notes)],
    ["נקלטה", fmtDate(r.created_at)],
  ].filter(([, v]) => v);
  const hist = history.filter((h) => h.request_id === id);
  $("#d-body").innerHTML = `<div class="kv">${kv.map(([k, v]) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("")}</div>
    <div class="hist"><h3>היסטוריה</h3>${hist.map((h) => `<div class="h-item">
      <span class="ts">${esc(h.ts.slice(5, 16).replace("T", " "))}</span> · <b>${esc(h.action)}</b>${h.field && h.field !== "status" ? ` (${esc(h.field)})` : ""}
      ${h.old_value || h.new_value ? `: ${esc(h.old_value) || "ריק"} ← ${esc(h.new_value) || "ריק"}` : ""}
      ${h.actor ? `<span class="ts"> · ${esc(h.actor)}</span>` : ""}</div>`).join("") || '<div class="h-item">אין רשומות</div>'}</div>`;
  $("#d-foot").innerHTML = (NEXT_ACTIONS[r.status] || []).map((s) =>
    `<button class="btn half ${s === "הושלמה" || s === "מאושרת" ? "primary" : ""}" data-status="${esc(s)}">${s === "הושלמה" ? "✔ סמן הושלמה" : s}</button>`).join("") +
    `<button class="btn half" id="d-copy">📋 העתק כ-WhatsApp</button><button class="btn half" id="d-edit">✏️ עריכה</button>`;
  document.querySelectorAll("#d-foot [data-status]").forEach((b) =>
    b.addEventListener("click", () => { updateRequest(id, { status: b.dataset.status }); toast(`הסטטוס עודכן ל"${b.dataset.status}"`); $("#modal-detail").hidden = true; render(); }));
  $("#d-copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(toWhatsApp(r)); toast("הועתק — אפשר להדביק ב-WhatsApp"); }
    catch { toast('ההעתקה נחסמה ע"י הדפדפן'); }
  });
  $("#d-edit").addEventListener("click", () => { $("#modal-detail").hidden = true; openForm(r); });
  $("#modal-detail").hidden = false;
}

function openForm(data) {
  editId = data ? data.id : null;
  $("#form-title").textContent = data ? `עריכת בקשה #${data.serial}` : "בקשה חדשה";
  const f = $("#req-form");
  f.reset();
  if (data) for (const k of FORM_FIELDS) if (f[k] && data[k]) f[k].value = data[k];
  updateMissingNote();
  $("#modal-form").hidden = false;
}
function formData() {
  const f = $("#req-form"), out = {};
  for (const k of FORM_FIELDS) out[k] = f[k].value.trim();
  return out;
}
function updateMissingNote() {
  const d = formData();
  const missing = Object.entries(REQUIRED).filter(([k]) => !d[k]).map(([, v]) => v);
  $("#form-missing").textContent = missing.length ? `⚠ חסרים: ${missing.join(", ")} — הבקשה תיקלט כ"מעוכבת" עד השלמתם` : "";
}

/* חיבורים */
$("#login-form").addEventListener("submit", (e) => {
  e.preventDefault();
  user = $("#login-name").value.trim() || "אורח";
  $("#btn-logout").textContent = `${user} · יציאה`;
  $("#login-screen").hidden = true;
  $("#app").hidden = false;
  render();
});
$("#btn-logout").addEventListener("click", () => { $("#app").hidden = true; $("#login-screen").hidden = false; });
$("#btn-new").addEventListener("click", () => openForm(null));
$("#btn-queue").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
$("#btn-save").addEventListener("click", (e) => {
  e.preventDefault();
  if (editId) { updateRequest(editId, formData()); toast("הבקשה עודכנה"); }
  else { const c = createRequest(formData()); toast(`נקלטה בקשה #${c.serial} (${c.status})`); }
  $("#modal-form").hidden = true;
  render();
});
$("#btn-subfilters").addEventListener("click", () => { $("#subfilters").classList.toggle("open"); $("#btn-subfilters").classList.toggle("on"); });
document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => (b.closest(".sheet-back").hidden = true)));
document.querySelectorAll(".sheet-back").forEach((m) => m.addEventListener("click", (e) => { if (e.target === m) m.hidden = true; }));
$("#req-form").addEventListener("input", updateMissingNote);
$("#f-search").addEventListener("input", () => { clearTimeout(window._st); window._st = setTimeout(render, 200); });
$("#f-project").addEventListener("change", render);
$("#f-location").addEventListener("change", render);

seed();
</script>
